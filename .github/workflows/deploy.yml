name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release

  build-and-push-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and tag Docker image
        working-directory: ./CoffeeNChill.Functions
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-functions:v1.${{ github.run_number }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-functions:v1.${{ github.run_number }} ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-functions:latest

      - name: Push versioned and latest tags to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-functions:v1.${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-functions:latest

  deploy-to-vps:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/coffeenchill
            docker compose pull
            docker compose up -d